# tdlib.lock: every pin of this build, sourceable by bash (`source tdlib.lock`) and by the workflows.
# Changing any value here means a new release: bump RELEASE_TAG (a re-run of the same TDLib commit gets a `-rN`
# suffix), on a branch, with the owner's yes (README, "Changing a pin").
#
# OpenSSL fallback rule: the build uses OpenSSL 3.5 LTS. Only if 3.5 fails to build, switch to OpenSSL 1.1.1w by
# changing the four OPENSSL_* lines below to
#   OPENSSL_VERSION=openssl-1.1.1w
#   OPENSSL_URL=https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
#   OPENSSL_SHA256=<sha256 of that release asset>
#   OPENSSL_DIR=openssl-1.1.1w
# and record here, as a comment, the date and the reason 3.5 failed. Fallback in use: none.

